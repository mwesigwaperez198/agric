services:
  - type: web
    name: agric-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agric-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13"

databases:
  - name: agric-db
    plan: free
    databaseName: agric
    ipAllowList: []
